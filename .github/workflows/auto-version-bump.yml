name: Release on Merge

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          ref: main

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.20.0
          run_install: false

      # - name: Setup Takumi Guard Registry
      #   uses: flatt-security/setup-takumi-guard-npm@v1

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        # env:
        #   NPM_CONFIG_FETCHING_CONCURRENCY: "4"
        #   NPM_CONFIG_NETWORK_CONCURRENCY: "4"
        #   NPM_CONFIG_FETCH_RETRIES: "5"
        #   NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "15000"
        #   NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "60000"

      - name: Configure Git User
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Release and push to main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm exec release-it --ci
          git push origin main
          git push --tags

      - name: Merge main into develop
        run: |
          git checkout develop
          git pull origin develop
          git merge main --no-ff -m "Merge main branch with latest release version"
          git push origin develop
